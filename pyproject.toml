[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pysweb"
version = "0.1.0"
description = "Soil Water-Energy Balance model for layered soil moisture"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yi Yu"}]
keywords = ["soil-moisture", "hydrology", "remote-sensing", "SSEBop"]
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "xarray>=2024.1", "scipy>=1.11",
  "rasterio>=1.3", "rioxarray>=0.15", "pyproj>=3.6", "netCDF4>=1.6",
  "earthengine-api>=1.0", "requests>=2.31", "PyYAML>=6", "python-dateutil>=2.8",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "build>=1.2", "matplotlib>=3.8"]

[project.scripts]
pysweb = "pysweb.cli:main"

[project.urls]
Repository = "https://github.com/yuyi13/PySWEB"
Issues = "https://github.com/yuyi13/PySWEB/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["pysweb", "pysweb.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
