name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - name: Test the installed wheel outside the checkout
        shell: bash
        run: |
          python -m pip uninstall -y pysweb
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          pysweb --help
          pysweb demo --output-dir "$RUNNER_TEMP/pysweb-demo" --workers 2
