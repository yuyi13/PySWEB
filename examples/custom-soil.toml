# Paths resolve relative to this file. Edit for your study before online execution.
[run]
name = "custom_soil"
root = "outputs"
start = "2024-01-01"
end = "2024-01-31"
extent = [148.0, -35.02, 148.02, -35.0]
grid_mode = "native"
sensors = ["LC08", "LC09"] # Add "LT05", "LE07" explicitly when needed.
processing_buffer_m = 14400
workers = 1
gee_project = "your-gee-project"
state_timing = "start"

[soil]
source = "custom"
file = "outputs/demo/source/custom_soil.nc"

[calibration]
enabled = false
seed = 0
max_iter = 100
spinup_days = 7

[model]
diff_factor = 1000.0
root_beta = 0.96

[ssebop]
lst_band = "auto"
red_band = "SR_B4"
nir_band = "SR_B5"
ndvi_band = "ndvi"
